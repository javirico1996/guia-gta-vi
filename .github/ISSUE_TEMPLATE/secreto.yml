name: "🗺️ Secreto o easter egg"
description: Una ubicación especial, easter egg, misterio o referencia
title: "[Secreto] "
labels: ["secreto"]
body:
  - type: input
    id: nombre
    attributes:
      label: Nombre
    validations:
      required: true
  - type: dropdown
    id: categoria
    attributes:
      label: Categoría
      options: ["GTA anteriores", "Otros juegos de Rockstar", "Cine y series", "Misterio", "Paranormal", "Broma de Rockstar", "Zona oculta", "Evento aleatorio", "Otra"]
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Región / ubicación
      placeholder: "Vice City, cerca de…"
    validations:
      required: true
  - type: textarea
    id: como
    attributes:
      label: Cómo encontrarlo paso a paso
      description: Requisitos (hora, personaje, misión previa) y qué ocurre
    validations:
      required: true
  - type: textarea
    id: fuente
    attributes:
      label: Fuente o captura
    validations:
      required: true
